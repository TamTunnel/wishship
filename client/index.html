<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WishShip — vote-to-ship loop</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; color: #1a1a1a; background: #fafafa; }
      header { background: #111; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; }
      header a { color: #9fd0ff; text-decoration: none; }
      main { max-width: 900px; margin: 0 auto; padding: 20px; }
      .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
      .muted { color: #666; font-size: 0.9em; }
      .flag { background: #fff3cd; border: 1px solid #e6c200; padding: 6px 10px; border-radius: 6px; display: inline-block; }
      button { cursor: pointer; padding: 6px 12px; border-radius: 6px; border: 1px solid #bbb; background: #fff; }
      button.primary { background: #111; color: #fff; border-color: #111; }
      input, textarea, select { width: 100%; padding: 8px; margin: 4px 0 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .state { font-size: 0.8em; padding: 2px 8px; border-radius: 999px; background: #eee; }
      .state.shipped { background: #d4edda; }
      .state.pr_open { background: #cce5ff; }
      .state.rejected { background: #f8d7da; }
      table { width: 100%; border-collapse: collapse; }
      td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 0.95em; }
      .error { background: #f8d7da; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
